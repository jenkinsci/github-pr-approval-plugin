---
# Copy this file into jenkins-infra/repository-permissions-updater under permissions/
# to grant release permissions for io.jenkins.plugins:github-pr-approval.
name: "github-pr-approval"
github: &gh "jenkinsci/github-pr-approval-plugin"
issues:
  - github: *gh
paths:
  - "io/jenkins/plugins/github-pr-approval"
developers:
  - "olamy"
cd:
  enabled: true
